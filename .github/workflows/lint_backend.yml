name: Lint Backend (Server)

on: [push, pull_request]

jobs:
  lint-server-js:
    name: Lint Server JavaScript
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Server Dependencies
        run: npm install

      - name: Run ESLint on Server
        run: npm run lint

  lint-server-python:
    name: Lint Server Python Files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flake8
        run: pip install flake8

      - name: Run Flake8 on Python Files
        run: flake8 server/**/*.py
